<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neural Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --surface: #031427;
    --surface-container: #102034;
    --surface-container-high: #1b2b3f;
    --on-surface: #d3e4fe;
    --on-surface-variant: #c6c6cd;
    --secondary: #5de6ff;
    --tertiary: #ddb7ff;
    --primary: #bec6e0;
    --outline: #909097;

    --cat-entry: #5de6ff;
    --cat-logic: #ddb7ff;
    --cat-data: #a2eeff;
    --cat-ui: #f0dbff;
    --cat-config: #00cbe6;
    --cat-style: #bec6e0;
    --cat-test: #909097;
    --cat-doc: #c6c6cd;

    --select-ring: #5de6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    overflow: hidden;
    height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(93, 230, 255, 0.4) 0.5px, transparent 0.5px);
    background-size: 32px 32px;
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
  }
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 24px;
    background: rgba(3, 20, 39, 0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 24px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    color: var(--secondary);
    letter-spacing: -0.01em;
  }
  header .meta {
    font-size: 12px;
    color: var(--on-surface-variant);
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  header .world {
    font-size: 12px;
    color: var(--tertiary);
    font-style: italic;
    opacity: 0.85;
  }
  header .legend {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--on-surface-variant);
  }
  header .legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  header .legend .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  #graph {
    position: fixed;
    inset: 0;
    z-index: 1;
  }
  .node-circle {
    cursor: pointer;
    transition: filter 0.2s ease;
    filter: drop-shadow(0 0 8px currentColor);
  }
  .node-circle:hover {
    filter: drop-shadow(0 0 16px currentColor);
  }
  .node-circle.selected {
    stroke: var(--select-ring);
    stroke-width: 3;
    filter: drop-shadow(0 0 20px var(--select-ring));
  }
  .node-label {
    fill: var(--on-surface);
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    text-anchor: middle;
  }
  .link {
    stroke: var(--secondary);
    stroke-opacity: 0.2;
    stroke-dasharray: 4 6;
  }

  /* ---- Detail panel (unchanged from v0.1) ---- */
  #detail-panel {
    position: fixed;
    top: 80px;
    right: 24px;
    width: 320px;
    padding: 20px;
    background: rgba(27, 43, 63, 0.85);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(93, 230, 255, 0.2);
    border-radius: 12px;
    box-shadow: 0 0 24px rgba(93, 230, 255, 0.1);
    z-index: 20;
    opacity: 0;
    transform: translateX(20px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  #detail-panel.visible {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  #detail-panel .concept-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  #detail-panel .metaphor {
    font-size: 14px;
    line-height: 1.5;
    color: var(--on-surface-variant);
    font-style: italic;
    margin-bottom: 16px;
  }
  #detail-panel .filepath {
    font-size: 11px;
    font-family: 'SF Mono', Menlo, monospace;
    color: var(--secondary);
    background: rgba(93, 230, 255, 0.08);
    padding: 6px 10px;
    border-radius: 4px;
    word-break: break-all;
    margin-bottom: 12px;
  }
  #detail-panel .stats {
    display: flex;
    gap: 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--on-surface-variant);
  }
  #detail-panel .stats span strong {
    display: block;
    font-size: 16px;
    color: var(--on-surface);
    text-transform: none;
    letter-spacing: 0;
    margin-top: 2px;
  }
  .dp-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: transparent;
    border: none;
    color: var(--on-surface-variant);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 4px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .dp-close:hover {
    color: var(--on-surface);
    background: rgba(255, 255, 255, 0.06);
  }

  /* ---- Composer panel (NEW in v0.2) ---- */
  #composer {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 380px;
    padding: 18px 20px 16px;
    background: rgba(27, 43, 63, 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(93, 230, 255, 0.25);
    border-radius: 12px;
    box-shadow: 0 0 32px rgba(93, 230, 255, 0.12);
    z-index: 25;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  #composer.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #composer .composer-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--on-surface-variant);
    margin-bottom: 12px;
  }
  #composer .selection-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
    max-height: 96px;
    overflow-y: auto;
    padding-right: 4px;
  }
  #composer .selection-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(93, 230, 255, 0.06);
    border: 1px solid rgba(93, 230, 255, 0.15);
    border-radius: 6px;
    font-size: 12px;
  }
  #composer .selection-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #composer .selection-chip .chip-name {
    font-weight: 600;
    color: var(--on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #composer .selection-chip .chip-path {
    color: var(--on-surface-variant);
    opacity: 0.7;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 10px;
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  #composer textarea {
    width: 100%;
    min-height: 72px;
    max-height: 200px;
    padding: 10px 12px;
    background: rgba(3, 20, 39, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    color: var(--on-surface);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #composer textarea:focus {
    border-color: rgba(93, 230, 255, 0.4);
  }
  #composer textarea::placeholder {
    color: var(--on-surface-variant);
    opacity: 0.5;
  }
  #composer .composer-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  #composer button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #composer .btn-ask {
    background: var(--secondary);
    color: var(--surface);
    flex: 1;
  }
  #composer .btn-ask:hover { background: #7eedff; }
  #composer .btn-ask:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #composer .btn-cancel {
    background: transparent;
    color: var(--on-surface-variant);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  #composer .btn-cancel:hover {
    color: var(--on-surface);
    background: rgba(255, 255, 255, 0.04);
  }
  #composer .composer-status {
    margin-top: 10px;
    font-size: 11px;
    color: var(--on-surface-variant);
    min-height: 14px;
  }
  #composer .composer-status.error { color: #ff9b9b; }
  #composer .composer-status.success { color: var(--secondary); }

  /* ---- Empty state (unchanged from v0.1) ---- */
  #empty-state {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
    color: var(--on-surface-variant);
  }
  #empty-state h2 {
    color: var(--secondary);
    font-size: 24px;
    margin-bottom: 8px;
  }
  #empty-state p {
    max-width: 400px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1 id="project-title">Neural Map</h1>
  <span class="meta" id="generated-at"></span>
  <span class="world" id="world-label"></span>
  <div class="legend">
    <span><i class="dot" style="background:var(--cat-entry)"></i>Entry</span>
    <span><i class="dot" style="background:var(--cat-logic)"></i>Logic</span>
    <span><i class="dot" style="background:var(--cat-data)"></i>Data</span>
    <span><i class="dot" style="background:var(--cat-ui)"></i>UI</span>
    <span><i class="dot" style="background:var(--cat-config)"></i>Config</span>
    <span><i class="dot" style="background:var(--cat-style)"></i>Style</span>
    <span><i class="dot" style="background:var(--cat-test)"></i>Test</span>
    <span><i class="dot" style="background:var(--cat-doc)"></i>Doc</span>
  </div>
</header>

<svg id="graph"></svg>

<aside id="detail-panel">
  <button class="dp-close" id="dp-close" aria-label="Close detail panel">×</button>
  <div class="concept-name" id="dp-name"></div>
  <div class="metaphor" id="dp-metaphor"></div>
  <div class="filepath" id="dp-path"></div>
  <div class="stats">
    <span>Category<strong id="dp-cat"></strong></span>
    <span>Weight<strong id="dp-weight"></strong></span>
    <span>Size<strong id="dp-size"></strong></span>
  </div>
</aside>

<aside id="composer">
  <div class="composer-title" id="composer-title">Selected — click "Ask" to send to Claude</div>
  <div class="selection-list" id="selection-list"></div>
  <textarea id="composer-input" placeholder="Ask Claude about these files… (e.g. how should these talk to each other?)"></textarea>
  <div class="composer-actions">
    <button class="btn-ask" id="btn-ask" disabled>Ask</button>
    <button class="btn-cancel" id="btn-cancel">Clear</button>
  </div>
  <div class="composer-status" id="composer-status"></div>
</aside>

<div id="empty-state" style="display:none">
  <h2>No nodes yet</h2>
  <p>Run <code>/neural-map:map</code> in your Claude Code session to scan the project and generate this visualization.</p>
</div>

<script>
  const STATE = __NEURAL_MAP_STATE__;
  const SERVER_URL = 'http://127.0.0.1:3737';

  // ---- Setup ----
  const svg = d3.select('#graph');
  const width = window.innerWidth;
  const height = window.innerHeight;
  svg.attr('width', width).attr('height', height);

  document.getElementById('project-title').textContent = STATE.projectName || 'Neural Map';
  if (STATE.generated) {
    const d = new Date(STATE.generated);
    document.getElementById('generated-at').textContent =
      `Generated ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
  }
  if (STATE.worldMetaphor) {
    document.getElementById('world-label').textContent = `mapped as ${STATE.worldMetaphor}`;
  }

  // ---- Selection state ----
  const selection = new Set(); // ids of selected nodes
  let nodesById = new Map(); // populated after renderGraph
  let nodeCircles = null; // d3 selection of node circles, for class toggling

  if (!STATE.nodes || STATE.nodes.length === 0) {
    document.getElementById('empty-state').style.display = 'flex';
  } else {
    nodesById = new Map(STATE.nodes.map(n => [n.id, n]));
    renderGraph(STATE.nodes);
  }

  function renderGraph(nodes) {
    const idSet = new Set(nodes.map(n => n.id));
    const links = [];
    nodes.forEach(n => {
      (n.connections || []).forEach(targetId => {
        if (idSet.has(targetId)) {
          links.push({ source: n.id, target: targetId });
        }
      });
    });

    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(140))
      .force('charge', d3.forceManyBody().strength(-400))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collide', d3.forceCollide(d => 12 + (d.weight || 1) * 8));

    const linkSel = svg.append('g')
      .selectAll('line')
      .data(links)
      .join('line')
      .attr('class', 'link')
      .attr('stroke-width', 2);

    const nodeGroup = svg.append('g')
      .selectAll('g')
      .data(nodes)
      .join('g')
      .call(drag(simulation))
      .on('click', (event, d) => {
        // Shift-click: toggle membership in selection (multi-select)
        // Plain click: replace selection with just this node, also open detail panel
        if (event.shiftKey) {
          if (selection.has(d.id)) selection.delete(d.id);
          else selection.add(d.id);
        } else {
          selection.clear();
          selection.add(d.id);
          showDetail(d);
        }
        renderSelectionUI();
      });

    nodeCircles = nodeGroup.append('circle')
      .attr('class', 'node-circle')
      .attr('r', d => 10 + (d.weight || 1) * 6)
      .attr('fill', d => `var(--cat-${d.category || 'doc'})`)
      .attr('stroke', 'rgba(255,255,255,0.15)')
      .attr('stroke-width', 1.5);

    nodeGroup.append('text')
      .attr('class', 'node-label')
      .attr('dy', d => 28 + (d.weight || 1) * 6)
      .text(d => {
        const name = d.conceptName || '';
        return name.length > 24 ? name.slice(0, 23) + '…' : name;
      });

    simulation.on('tick', () => {
      linkSel
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);

      nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      svg.attr('width', w).attr('height', h);
      simulation.force('center', d3.forceCenter(w / 2, h / 2));
      simulation.alpha(0.3).restart();
    });
  }

  function drag(simulation) {
    return d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on('drag', (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      });
  }

  function showDetail(d) {
    document.getElementById('dp-name').textContent = d.conceptName || '—';
    document.getElementById('dp-metaphor').textContent = d.metaphor || '';
    document.getElementById('dp-path').textContent = d.path || '';
    document.getElementById('dp-cat').textContent = d.category || '—';
    document.getElementById('dp-weight').textContent = d.weight || '—';
    document.getElementById('dp-size').textContent = d.size ? formatBytes(d.size) : '—';
    document.getElementById('detail-panel').classList.add('visible');
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  // ---- Selection UI ----
  function renderSelectionUI() {
    // Update node ring styling
    if (nodeCircles) {
      nodeCircles.classed('selected', d => selection.has(d.id));
    }

    const composer = document.getElementById('composer');
    const list = document.getElementById('selection-list');
    const btnAsk = document.getElementById('btn-ask');
    const status = document.getElementById('composer-status');

    if (selection.size === 0) {
      composer.classList.remove('visible');
      btnAsk.disabled = true;
      list.innerHTML = '';
      status.textContent = '';
      status.className = 'composer-status';
      return;
    }

    composer.classList.add('visible');

    list.innerHTML = '';
    for (const id of selection) {
      const node = nodesById.get(id);
      if (!node) continue;
      const chip = document.createElement('div');
      chip.className = 'selection-chip';
      chip.innerHTML = `
        <span class="dot" style="background:var(--cat-${node.category || 'doc'})"></span>
        <span class="chip-name">${escapeHtml(node.conceptName || '—')}</span>
        <span class="chip-path">${escapeHtml(node.path || '')}</span>
      `;
      list.appendChild(chip);
    }

    updateAskButtonState();
  }

  function updateAskButtonState() {
    const text = document.getElementById('composer-input').value.trim();
    document.getElementById('btn-ask').disabled = (selection.size === 0 || text === '');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  document.getElementById('composer-input').addEventListener('input', updateAskButtonState);

  document.getElementById('btn-cancel').addEventListener('click', () => {
    selection.clear();
    document.getElementById('composer-input').value = '';
    renderSelectionUI();
  });

  document.getElementById('btn-ask').addEventListener('click', sendToServer);

  document.getElementById('composer-input').addEventListener('keydown', e => {
    // Cmd/Ctrl+Enter sends
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      const btn = document.getElementById('btn-ask');
      if (!btn.disabled) sendToServer();
    }
  });

  async function sendToServer() {
    const status = document.getElementById('composer-status');
    const btnAsk = document.getElementById('btn-ask');
    const input = document.getElementById('composer-input');

    const question = input.value.trim();
    if (!question || selection.size === 0) return;

    const payload = {
      question,
      selection: Array.from(selection).map(id => {
        const n = nodesById.get(id) || { id };
        return { id: n.id, path: n.path, conceptName: n.conceptName };
      })
    };

    btnAsk.disabled = true;
    status.textContent = 'Sending…';
    status.className = 'composer-status';

    try {
      const res = await fetch(`${SERVER_URL}/pending`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
        throw new Error(err.error || 'request failed');
      }
      status.textContent = "Sent. In your terminal, type any prompt (e.g. 'go') and press Enter.";
      status.className = 'composer-status success';
      input.value = '';
      selection.clear();
      renderSelectionUI();
      // Re-show success status — renderSelectionUI clears it
      status.textContent = "Sent. In your terminal, type any prompt (e.g. 'go') and press Enter.";
      status.className = 'composer-status success';
    } catch (err) {
      // Server unreachable. Fall back to clipboard.
      status.className = 'composer-status error';
      const fallbackText = formatFallbackPrompt(payload);
      try {
        await navigator.clipboard.writeText(fallbackText);
        status.textContent = "Server unreachable — prompt copied to clipboard. Paste it in your terminal.";
      } catch (clipErr) {
        status.textContent = "Server unreachable. Re-run /neural-map:map to restart it.";
      }
      btnAsk.disabled = false;
    }
  }

  function formatFallbackPrompt(payload) {
    const lines = [
      `[Neural Map] ${payload.question}`,
      '',
      'Files in question:'
    ];
    for (const sel of payload.selection) {
      lines.push(`- ${sel.path}${sel.conceptName ? ` ("${sel.conceptName}")` : ''}`);
    }
    return lines.join('\n');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('detail-panel').classList.remove('visible');
      // ESC also clears composer if focus is in textarea
      if (document.activeElement === document.getElementById('composer-input')) {
        document.getElementById('composer-input').blur();
      }
    }
  });

  document.getElementById('dp-close').addEventListener('click', () => {
    document.getElementById('detail-panel').classList.remove('visible');
  });
</script>
</body>
</html>
